[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-check"
version = "0.1.0"
description = "Say whether an image's own records show it was made or edited with AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "c2pa-python>=0.38,<0.39",
    "Pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiimagecheck = "aiimagecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiimagecheck = ["page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
